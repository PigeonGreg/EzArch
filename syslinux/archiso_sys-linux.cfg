LABEL arch
TEXT HELP
Boot the EzArch Linux install + Live User medium on BIOS.
It allows you to install EzArch Linux or perform system maintenance.
ENDTEXT
MENU LABEL EzArch Linux install + Live User medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the EzArch Linux install + Live User medium on BIOS with speakup screen reader.
It allows you to install EzArch Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL EzArch Linux install + Live User medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
